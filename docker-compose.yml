services:
  app:
    build: ./app
    container_name: buildforge-app
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - ENV=production
    networks:
      - buildforge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  ingress:
    image: nginx:alpine
    container_name: buildforge-ingress
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - buildforge-net
    restart: unless-stopped

networks:
  buildforge-net:
    driver: bridge
